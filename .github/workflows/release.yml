# Rilis PRE-RELEASE otomatis (pemilik 9 Okt 2026): runner Windows x64 menjalankan
# pack.ps1 yang sama dengan rilis manual lalu membuat GitHub pre-release berisi
# seluruh isi Releases\. Armada (releases/latest) mengabaikan pre-release; promosi
# tetap tindakan terpisah (hapus centang pre-release) atas perintah pemilik.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi X.Y.Z — harus sama dengan <Version> di SpikeTransport.vbproj"
        required: true
permissions:
  contents: write
jobs:
  pack-prerelease:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Versi cocok dan belum pernah dirilis
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Versi tidak sah: $env:VERSION" }
          $m = Select-String -Path src/SpikeTransport/SpikeTransport.vbproj -Pattern '<Version>([^<]+)</Version>'
          $pv = $m.Matches[0].Groups[1].Value
          if ($pv -ne $env:VERSION) { throw "Versi input $env:VERSION != vbproj $pv" }
          gh release view "v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Rilis v$env:VERSION sudah ada" }
          $global:LASTEXITCODE = 0
      - name: Pasang vpk 1.2.0
        run: dotnet tool install -g vpk --version 1.2.0
      - name: pack.ps1
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: .\pack.ps1 -Version $env:VERSION
      - name: GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          Get-FileHash Releases\* -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 200
          $files = Get-ChildItem Releases -File | ForEach-Object { $_.FullName }
          gh release create "v$env:VERSION" @files --prerelease --target $env:GITHUB_SHA --title "v$env:VERSION" `
            --notes "Pre-release otomatis dari CI (commit $env:GITHUB_SHA) untuk pilot. Armada tidak menerima pre-release sampai dipromosikan."
